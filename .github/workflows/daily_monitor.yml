name: Daily Scholar Monitor

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "_scholar/config.yaml"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: _scholar/requirements.txt

      - name: Install dependencies
        working-directory: _scholar
        run: pip install -r requirements.txt

      - name: Discover RSS feeds
        working-directory: _scholar
        run: python scripts/discover_rss.py
        continue-on-error: true

      - name: Restore Zhihu cookies
        working-directory: _scholar
        run: |
          if [ -n "${{ secrets.ZHIHU_COOKIES_B64 }}" ]; then
            mkdir -p _snapshots
            echo "${{ secrets.ZHIHU_COOKIES_B64 }}" | base64 -d > _snapshots/zhihu_cookies.txt
            echo "Zhihu cookies restored"
          else
            echo "No Zhihu cookies configured - Zhihu sites will fall back to content check"
          fi

      - name: Monitor scholars
        working-directory: _scholar
        run: python scripts/monitor.py

      - name: Commit snapshots & report
        working-directory: _scholar
        run: |
          git config user.name "scholar-monitor[bot]"
          git config user.email "scholar-monitor[bot]@users.noreply.github.com"
          git add _snapshots/ ../scholar/
          git diff --cached --quiet || git commit -m "chore: daily scholar monitor update [$(date +'%Y-%m-%d')]"
          git push
