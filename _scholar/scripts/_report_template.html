---
layout: default
title: Scholar Monitor
permalink: /scholar/
---

<div class="scholar-monitor-page">
  <header class="sm-header">
    <div>
      <h1 class="sm-title">学者动态</h1>
      <p class="sm-subtitle">同步于 {now} · 监控 {total} 位学者</p>
    </div>
    {stats_html}
  </header>
  {body}
</div>

<style>
.container:has(.scholar-monitor-page) {
  max-width: 1200px;
}

.scholar-monitor-page {
  font-family: inherit;
  color: var(--global-text-color);
  padding: 8px 0 48px;
  line-height: 1.55;
  max-width: 100%;
}

.sm-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 2px solid var(--global-divider-color);
}

.sm-title {
  font-size: 2rem;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.03em;
}

.sm-subtitle {
  margin: 4px 0 0;
  color: var(--global-text-color-light);
  font-size: 0.9rem;
}

.sm-stats {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.sm-stat {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 600;
  border: 1px solid var(--global-divider-color);
  background: var(--global-code-bg-color);
}

.sm-stat-new { border-color: #2e7d32; color: #2e7d32; background: rgba(46,125,50,.06); }
.sm-stat-warn { border-color: #c62828; color: #c62828; background: rgba(198,40,40,.06); }
.sm-stat-muted { color: var(--global-text-color-light); }

.sm-filters {
  background: var(--global-card-bg-color);
  border: 1px solid var(--global-divider-color);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 28px;
}

.sm-search {
  width: 100%;
  max-width: 420px;
  padding: 9px 14px;
  border: 1px solid var(--global-divider-color);
  border-radius: 8px;
  background: var(--global-bg-color);
  color: var(--global-text-color);
  font-size: 0.95rem;
  margin-bottom: 12px;
}

.sm-search:focus {
  outline: none;
  border-color: var(--global-theme-color);
  box-shadow: 0 0 0 3px rgba(85,122,159,.12);
}

.sm-filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}

.sm-filter-label {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--global-text-color-light);
  margin-right: 4px;
}

.sm-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 12px;
  border-radius: 16px;
  border: 1px solid var(--global-divider-color);
  font-size: 0.82rem;
  cursor: pointer;
  user-select: none;
}

.sm-chip:has(input:checked) {
  border-color: var(--global-theme-color);
  background: rgba(85,122,159,.08);
  color: var(--global-theme-color);
  font-weight: 600;
}

.sm-filter-more {
  margin-top: 8px;
  font-size: 0.85rem;
}

.sm-filter-more summary {
  cursor: pointer;
  color: var(--global-theme-color);
  font-weight: 600;
  padding: 4px 0;
}

.sm-filter-count {
  margin-top: 10px;
  font-size: 0.82rem;
  color: var(--global-text-color-light);
}

.sm-section-title {
  font-size: 1.35rem;
  font-weight: 800;
  margin: 0 0 16px;
  letter-spacing: -0.02em;
}

.sm-timeline { margin-bottom: 32px; }

.sm-tl-group { margin-bottom: 24px; }

.sm-tl-heading {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--global-text-color-light);
  margin: 0 0 10px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.sm-tl-count {
  background: var(--global-code-bg-color);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 0.78rem;
}

.sm-tl-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.sm-tl-item {
  background: var(--global-card-bg-color);
  border: 1px solid var(--global-divider-color);
  border-radius: 10px;
  padding: 14px 16px;
  transition: border-color .2s;
}

.sm-tl-item:hover { border-color: var(--global-theme-color); }

.sm-tl-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.sm-kind {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
  text-transform: uppercase;
}

.sm-kind-paper { background: rgba(25,118,210,.1); color: #1976d2; }
.sm-kind-post { background: rgba(239,108,0,.1); color: #ef6c00; }
.sm-kind-news { background: rgba(56,142,60,.1); color: #388e3c; }
.sm-kind-update { background: rgba(117,117,117,.1); color: #757575; }

.sm-tl-scholar {
  font-weight: 700;
  color: var(--global-text-color);
  text-decoration: none;
  font-size: 1rem;
}

.sm-tl-scholar:hover { color: var(--global-theme-color); text-decoration: none; }

.sm-tag {
  font-size: 0.75rem;
  padding: 2px 8px;
  border-radius: 10px;
}

.sm-tag-aff {
  background: rgba(85,122,159,.08);
  color: var(--global-theme-color);
  border: 1px solid rgba(85,122,159,.15);
}

.sm-tag-area {
  background: rgba(56,142,60,.08);
  color: #388e3c;
  border: 1px solid rgba(56,142,60,.12);
}

.sm-tl-date {
  margin-left: auto;
  font-size: 0.8rem;
  color: var(--global-text-color-light);
}

.sm-tl-text {
  margin: 0;
  font-size: 0.95rem;
  line-height: 1.5;
  color: var(--global-text-color);
  text-decoration: none;
  display: block;
}

a.sm-tl-text:hover { color: var(--global-theme-color); text-decoration: none; }

.sm-tl-diff { margin-top: 8px; }
.sm-tl-diff summary {
  font-size: 0.82rem;
  color: var(--global-theme-color);
  cursor: pointer;
  font-weight: 600;
}

.sm-diff {
  margin-top: 8px;
  padding: 10px;
  background: var(--global-bg-color);
  border: 1px solid var(--global-divider-color);
  border-radius: 8px;
  font-family: var(--global-code-font, monospace);
  font-size: 0.8rem;
  max-height: 200px;
  overflow-y: auto;
  white-space: pre-wrap;
}

.da2 { color: #2e7d32; background: rgba(46,125,50,.08); display: block; padding: 1px 4px; }
.dd2 { color: #c62828; background: rgba(198,40,40,.08); display: block; padding: 1px 4px; }
.dh { color: var(--global-text-color-light); display: block; font-weight: 600; }

.sm-empty {
  text-align: center;
  padding: 40px 20px;
  border: 1px dashed var(--global-divider-color);
  border-radius: 12px;
  background: rgba(85,122,159,.02);
}

.sm-empty-title { font-weight: 700; color: var(--global-text-color-light); }
.sm-empty-sub { font-size: 0.85rem; color: var(--global-text-color-light); margin-top: 6px; }

.sm-panel {
  border: 1px solid var(--global-divider-color);
  border-radius: 12px;
  margin-bottom: 20px;
  overflow: hidden;
}

.sm-panel-warn { border-left: 4px solid #c62828; }

.sm-panel-title {
  padding: 14px 18px;
  font-weight: 700;
  cursor: pointer;
  background: var(--global-code-bg-color);
  list-style: none;
}

.sm-panel-title::-webkit-details-marker { display: none; }

.sm-attn-list {
  list-style: none;
  padding: 0 18px 14px;
  margin: 0;
}

.sm-attn-item {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px;
  padding: 10px 0;
  border-bottom: 1px solid var(--global-divider-color);
  font-size: 0.9rem;
}

.sm-attn-item:last-child { border-bottom: none; }

.sm-attn-name { font-weight: 700; color: var(--global-text-color); text-decoration: none; }
.sm-attn-name:hover { color: var(--global-theme-color); text-decoration: none; }

.sm-attn-err {
  font-size: 0.8rem;
  color: #c62828;
  background: rgba(198,40,40,.05);
  padding: 2px 6px;
  border-radius: 4px;
  word-break: break-all;
}

.sm-attn-hint {
  font-size: 0.8rem;
  color: var(--global-text-color-light);
  font-style: italic;
  width: 100%;
}

.sm-dir-wrap { overflow-x: auto; padding: 0 18px 16px; }

.sm-dir-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}

.sm-dir-table th {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 2px solid var(--global-divider-color);
  color: var(--global-text-color-light);
  font-weight: 700;
  font-size: 0.8rem;
}

.sm-dir-table td {
  padding: 10px;
  border-bottom: 1px solid var(--global-divider-color);
  vertical-align: top;
}

.sm-dir-table a { color: var(--global-text-color); text-decoration: none; font-weight: 600; }
.sm-dir-table a:hover { color: var(--global-theme-color); }

.sm-dir-status {
  font-size: 0.75rem;
  font-weight: 700;
  white-space: nowrap;
}

.sm-st-rss, .sm-st-changed { color: #2e7d32; }
.sm-st-error { color: #c62828; }
.sm-st-unchanged, .sm-st-rss_no_change, .sm-st-first_check { color: var(--global-text-color-light); }

.sm-dir-latest {
  color: var(--global-text-color-light);
  font-size: 0.82rem;
  max-width: 360px;
}

.sm-dir-updated {
  font-size: 0.82rem;
  white-space: nowrap;
  color: var(--global-text-color-light);
}

.sm-hidden { display: none !important; }

@media (max-width: 640px) {
  .sm-title { font-size: 1.6rem; }
  .sm-tl-date { margin-left: 0; width: 100%; }
  .sm-dir-latest { max-width: 160px; }
}
</style>

<script>
function applyFilters() {
  const q = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
  const kinds = [...document.querySelectorAll('.fl-kind:checked')].map(c => c.value);
  const affs = [...document.querySelectorAll('.fl-aff:checked')].map(c => c.value);
  const areas = [...document.querySelectorAll('.fl-area:checked')].map(c => c.value);

  let visible = 0, total = 0;

  document.querySelectorAll('[data-filterable]').forEach(el => {
    total++;
    const name = el.dataset.name || '';
    const text = el.dataset.text || '';
    const affiliation = el.dataset.affiliation || '';
    const areaList = (el.dataset.areas || '').split(',').map(x => x.trim()).filter(Boolean);
    const kind = el.dataset.kind || 'update';

    const matchSearch = !q || name.includes(q) || text.includes(q) || affiliation.includes(q)
      || areaList.some(a => a.includes(q));
    const matchKind = kinds.length === 0 || kinds.includes(kind);
    const matchAff = affs.length === 0 || !affiliation || affs.includes(affiliation);
    const matchArea = areas.length === 0 || areaList.length === 0
      || areaList.some(a => areas.includes(a));

    const show = matchSearch && matchKind && matchAff && matchArea;
    el.classList.toggle('sm-hidden', !show);
    if (show) visible++;
  });

  document.querySelectorAll('.sm-tl-group').forEach(g => {
    const has = g.querySelector('.sm-tl-item:not(.sm-hidden)');
    g.classList.toggle('sm-hidden', !has);
  });

  const vc = document.getElementById('visibleCount');
  const tc = document.getElementById('totalCount');
  if (vc) vc.textContent = visible;
  if (tc) tc.textContent = total;
}

document.addEventListener('DOMContentLoaded', applyFilters);
</script>
