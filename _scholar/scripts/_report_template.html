---
layout: default
title: Scholar Monitor
permalink: /scholar/
---

<div class="scholar-monitor-page">
  <header class="sm-header">
    <div>
      <div class="sm-eyebrow">Academic Radar · 学者动态追踪</div>
      <h1 class="sm-title">学者动态</h1>
      <p class="sm-subtitle"><span class="status-indicator"></span>同步于 {now} · 监控 {total} 位学者</p>
    </div>
    {stats_html}
  </header>
  {body}
</div>


<script>
let currentScope = 'recent'; // 'recent' (week + month), 'week', 'month', 'all'

function setScope(scope) {
  currentScope = scope;
  document.querySelectorAll('.sm-scope-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.scope === scope);
  });
  const earlierGroup = document.querySelector('.sm-tl-group-earlier');
  if (earlierGroup) {
    if (scope === 'all') {
      earlierGroup.open = true;
    } else if (scope === 'week' || scope === 'month') {
      earlierGroup.open = false;
    }
  }
  applyFilters();
}

function applyFilters() {
  const q = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
  const kinds = [...document.querySelectorAll('.fl-kind:checked')].map(c => c.value);
  const affs = [...document.querySelectorAll('.fl-aff:checked')].map(c => c.value);
  const areas = [...document.querySelectorAll('.fl-area:checked')].map(c => c.value);

  let visible = 0, total = 0;

  // Filter timeline items
  document.querySelectorAll('.sm-tl-item[data-filterable]').forEach(el => {
    total++;
    const name = el.dataset.name || '';
    const text = el.dataset.text || '';
    const affiliation = el.dataset.affiliation || '';
    const areaList = (el.dataset.areas || '').split(',').map(x => x.trim()).filter(Boolean);
    const kind = el.dataset.kind || 'update';
    const bucket = el.dataset.bucket || 'earlier';

    let matchScope = true;
    if (currentScope === 'week') {
      matchScope = (bucket === 'week');
    } else if (currentScope === 'month') {
      matchScope = (bucket === 'month');
    } else if (currentScope === 'recent') {
      matchScope = (bucket === 'week' || bucket === 'month');
    } // 'all' matches everything

    const matchSearch = !q || name.includes(q) || text.includes(q) || affiliation.includes(q)
      || areaList.some(a => a.includes(q));
    const matchKind = kinds.length === 0 || kinds.includes(kind);
    const matchAff = affs.length === 0 || !affiliation || affs.includes(affiliation);
    const matchArea = areas.length === 0 || areaList.length === 0
      || areaList.some(a => areas.includes(a));

    const show = matchScope && matchSearch && matchKind && matchAff && matchArea;
    el.classList.toggle('sm-hidden', !show);
    if (show) visible++;
  });

  // Filter non-timeline items (directory & attention panel, not restricted by scope)
  document.querySelectorAll('.sm-dir-row[data-filterable], .sm-attn-item[data-filterable]').forEach(el => {
    const name = el.dataset.name || '';
    const text = el.dataset.text || '';
    const affiliation = el.dataset.affiliation || '';
    const areaList = (el.dataset.areas || '').split(',').map(x => x.trim()).filter(Boolean);
    const kind = el.dataset.kind || 'update';

    const matchSearch = !q || name.includes(q) || text.includes(q) || affiliation.includes(q)
      || areaList.some(a => a.includes(q));
    const matchKind = kinds.length === 0 || kinds.includes(kind);
    const matchAff = affs.length === 0 || !affiliation || affs.includes(affiliation);
    const matchArea = areas.length === 0 || areaList.length === 0
      || areaList.some(a => areas.includes(a));

    const show = matchSearch && matchKind && matchAff && matchArea;
    el.classList.toggle('sm-hidden', !show);
  });

  document.querySelectorAll('.sm-tl-group').forEach(g => {
    const has = g.querySelector('.sm-tl-item:not(.sm-hidden)');
    g.classList.toggle('sm-hidden', !has);
  });

  const vc = document.getElementById('visibleCount');
  const tc = document.getElementById('totalCount');
  if (vc) vc.textContent = visible;
  if (tc) tc.textContent = total;
}

document.addEventListener('DOMContentLoaded', applyFilters);
</script>
