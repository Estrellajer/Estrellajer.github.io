    - title: Job Recommendation System Based on Knowledge Graphs | Project Leader
      year: 2024.04 - 2024.06
      description:
        - Overview: This project leverages a knowledge graph to help university students quickly identify ideal job opportunities and clarify their career positioning. By fine-tuning the open-source Paddle large language model for skill extraction and quantitative evaluation, the project fills gaps in job-related knowledge graphs and enhances visual analytics for understanding employment trends.

