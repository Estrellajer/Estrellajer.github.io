- title: Experience
  type: time_table
  contents:
    - title: LLM Algorithm Intern | ByteDance (Douyin E-commerce Customer Service)
      institution: ByteDance, Beijing
      year: 2026.06 - Present
      description:
        - "Mentor: Junwei He"
        - "Architecture migration to a single-Agent model replacing independently optimized scene models. Solely responsible for full-scenario RL post-training: data cleaning/filtering -> reward system construction -> model training and online deployment."
        - "Data Construction: Back-traced training & reward annotation data from online sessions with real actions and final outcomes; improved good-outcome annotation consistency from 14% to 90%+."
        - "Solution Reward: Modeled issue resolution with a distilled small RM (F1 0.86), explored real data correlations using TabPFN, and decomposed trajectory-level rewards into step-level actions for fine-grained credit assignment."
        - "Experience Reward: Converted pointwise scoring to role-swapped pairwise comparison with business protocol and whitelist hard constraints, boosting intra-group reward ranking for GRPO advantage estimation."
        - "Training & Deployment: GRPO training with dual rewards fully rolled out to pre-sales scenarios: session resolution +3.2pp, experience +2pp, interaction blockage rate -7pp."
        - "Post-Training Research: Explored Rubric-Based RL and OPD; proposed protocol-level rubrics ProRubric to mitigate reward hacking (First Author, under review); collaborated on Agentic RL with TabPFN credit assignment."

- title: Publications
  type: time_table
  contents:
    - title: "Scoring Higher, Answering Worse: Mitigating Reward Hacking in Rubric-Based RL via Protocol-Level Rubrics"
      year: 2026
      description:
        - First Author, Under Review
        - "Authors: Maoqi Liu, Junwei He, Bowen Zhang, et al."
        - "Overview: Identifies that reward hacking in Rubric-RL stems from compensatory linear weighted sum rather than criteria design. Proposes reorganizing rubrics into protocol-level dimensions where scores are awarded only when full protocol conditions are met without vetoes, achieving +10.8 appropriateness gain and outperforming all baselines across 7 benchmarks."
    - title: "CoDe-LoRA: Mitigating the Orthogonality Dilemma in Continual Learning of LLMs via Knowledge Consolidation and Decoupling"
      year: 2026
      description:
        - First Author, Accepted by EMNLP 2026 (CCF-B)
        - "Authors: Maoqi Liu, Quan Fang, Yufei He"
        - "Overview: Identifies the orthogonality dilemma in continual learning of LLMs, where strict orthogonal isolation discards shared knowledge. Proposes a replay-free dual-branch LoRA consolidating commonalities via adaptive null-space projection and decoupling task-specific features via prototype semantic routing, achieving 80.6% average accuracy on standard CL benchmarks (+7.0 over O-LoRA)."
    - title: "NOTAM-Evolve: A Knowledge-Guided Self-Evolving Optimization Framework with LLMs for NOTAM Interpretation"
      year: 2026
      description:
        - First Author, Accepted by AAAI 2026 (CCF-A)
        - "Authors: Maoqi Liu, Quan Fang, Yuhao Wu, Can Zhao, Yang Yang, Kaiquan Cai"
        - "Overview: Demonstrates that NOTAM deep interpretation requires dynamic knowledge grounding and regulation-based reasoning. Proposes knowledge-graph-guided retrieval combined with iterative SFT/DPO self-evolution, improving 7B model accuracy from 0.458 to 0.762."
    - title: "Knots: A Large-Scale Multi-Agent Enhanced Expert-Annotated Dataset and LLM Prompt Optimization for NOTAM Semantic Parsing"
      year: 2025
      description:
        - First Author, Accepted by Advanced Engineering Informatics (ADVEI 2025, SCI Q1, CCF-B)
        - "Authors: Maoqi Liu, Quan Fang, Yang Yang, et al."
        - "Overview: Advances NOTAM analysis from surface extraction to domain semantic parsing. Constructs a benchmark of 12,347 expert-annotated NOTAMs across 194 FIRs using a multi-agent debate framework (F1 92% vs 57% baseline)."
    - title: "R²A²-MoE: Ridge Regression-based Analytic Adaptation with Mixture of Experts for Continual Learning with Vision-Language Models"
      year: 2025
      description:
        - First Author, Accepted by PRCV 2025 (Oral)
        - "Overview: Proposes Ridge Regression-based Analytic Adaptation with Mixture of Experts for VLMs, mitigating dual forgetting through closed-form expert optimization."

